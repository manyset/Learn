
<style>
    .dropdown {
      position: relative;
      display: inline-block;
    }


    .dropdown-btn {
      background: #4a90e2;
      color: white;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .dropdown-btn:hover {
      background: #357ABD;
      transform: scale(1.05);
    }


    .dropdown-content {
      position: absolute;
      top: 110%;
      left: 0;
      background: white;
      min-width: 250px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      overflow: hidden;
      opacity: 0;
      transform: scaleY(0);
      transform-origin: top;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
      max-height: 300px;
      overflow-y: auto;
    }


    .dropdown-content.show {
      opacity: 1;
      transform: scaleY(1);
      pointer-events: auto;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      padding: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .dropdown-item:hover {
      background: #f0f0f0;
    }

    .dropdown-item img {
      width: 24px;
      height: 16px;
      margin-right: 10px;
      border: 1px solid #ccc;
    }

    .dropdown-item label {
      flex: 1;
      cursor: pointer;
    }

    .dropdown-item input {
      margin-right: 8px;
    }

    .result-btn {
      margin-top: 20px;
      background: #27ae60;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .result-btn:hover {
      background: #1e8449;
    }

    .result {
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
  </style>

<script type="module">

  const ROOT = (function () {
  const s = document.currentScript;
  return s ? s.getRootNode() : document;
})();

    document.getElementById('show1').addEventListener('click', showSelected);
    const btn = document.querySelector('.dropdown-btn');
    const content = document.querySelector('.dropdown-content');
    const dropdown = document.querySelector('.dropdown');


// Open dropdown on mouse over
dropdown.addEventListener('mouseover', () => {
  content.classList.add('show');
});

    btn.addEventListener('click', () => {
      content.classList.toggle('show');
    });

  
    // Close dropdown if clicked outside
     window.addEventListener('click', (e) => {
      if (!btn.contains(e.target) && !content.contains(e.target)) {
        content.classList.remove('show');
      }
    }); 

    // Close dropdown when mouse leaves the dropdown area
    dropdown.addEventListener('mouseleave', () => {
      content.classList.remove('show');
    }); 


function getSelectedCountries() {

  const dropdown = ROOT.querySelector('.dropdown-content');
  if (!dropdown) return [];

  const inputs = dropdown.querySelectorAll('input[type="checkbox"]');

  const selected = [];

  inputs.forEach(cb => {
    if (cb.checked) selected.push(cb.value);
  });

  return selected;
}

    async function showSelected() {
      const selected = getSelectedCountries();
       alert("Selected: " + selected.join(", "));
       document.getElementById('result').innerText = "sssss"; 
       //selected.length ? "Selected: " + selected.join(", ") : "No countries selected.";
    }
