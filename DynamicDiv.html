<div id="ContainerDiv">A Dynamic Div will be placed here and a comp will be injected</div>

<script type="module">
    import ms from './msLib/ms.js';

    await createNewDiv('DynaDiv', 'ContainerDiv');
    let s3 = await ms.inject('b', "DynaDiv");



    async function createNewDiv(DynaDiv, ContainerDiv) {
        // Step 1: Create a new div
        const newDiv = document.createElement("div");
        newDiv.id = DynaDiv;
        newDiv.style.border = "4px solid black";
        newDiv.style.padding = "10px";
        newDiv.style.marginTop = "10px";

        // Step 2: Create a textbox (input element)
        const textbox = document.createElement("input");
        textbox.type = "text";          // makes it a text field
        textbox.placeholder = "Enter text here"; // hint text
        textbox.style.width = "200px";  // optional styling

        // Step 3: Add the textbox into the new div
        newDiv.appendChild(textbox);

        // Step 4: Insert the new div into the existing container
        const container = ms.id(ContainerDiv);
        container.appendChild(newDiv);

        //let ref = ms.parent();
        //ref.ParentTest(100);
    }


</script>
