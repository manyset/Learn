<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Micro Frontend Team • Developer Theme</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Fira Code', monospace;
            background: #0a0f1a;
        }

        #title {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 4px;
            z-index: 100;
            text-shadow: 0 0 20px #00ccff, 0 0 40px #0066ff;
            background: rgba(10, 20, 40, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 40px;
            border-radius: 60px;
            border: 1px solid #3399ff;
            border-bottom: 3px solid #3399ff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #title span {
            font-size: 1.2rem;
            color: #88ffaa;
            background: #1a3344;
            padding: 5px 15px;
            border-radius: 40px;
            letter-spacing: 1px;
        }

        #status-panel {
            position: absolute;
            bottom: 40px;
            left: 40px;
            background: rgba(20, 30, 50, 0.95);
            backdrop-filter: blur(15px);
            color: #88ffaa;
            padding: 18px 35px;
            border-radius: 60px;
            border: 1px solid #88ffaa;
            font-size: 1.2rem;
            z-index: 100;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            letter-spacing: 1px;
            border-left: 5px solid #00ffaa;
            font-family: 'Fira Code', monospace;
        }

        #legend {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(15, 25, 45, 0.95);
            backdrop-filter: blur(15px);
            color: #ccddff;
            padding: 25px 35px;
            border-radius: 40px;
            border: 1px solid #ffaa44;
            font-size: 1rem;
            z-index: 100;
            line-height: 2.2;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            border-right: 5px solid #ffaa44;
            font-family: 'Fira Code', monospace;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
        }

        .legend-item:hover {
            transform: translateX(-5px);
            color: #ffaa88;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            box-shadow: 0 0 20px currentColor;
        }

        .instruction {
            position: absolute;
            top: 120px;
            right: 40px;
            color: #ffaa88;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 0.95rem;
            backdrop-filter: blur(8px);
            border: 1px solid #ffaa88;
            z-index: 100;
            border-top: 2px solid #ffaa88;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        #footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            z-index: 100;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div id="title">
        ⚡ MICRO FRONTEND TEAM
        <span>v2.4.0</span>
    </div>
    <div id="status-panel">🚀 Ready • Select a component</div>
    <div id="legend">
        <div class="legend-item"><span class="color-dot"
                style="background:#ff3366; box-shadow:0 0 20px #ff3366;"></span> TEAM LEAD • Architecture</div>
        <div class="legend-item"><span class="color-dot"
                style="background:#33ff99; box-shadow:0 0 20px #33ff99;"></span> UI ENGINEER • Components</div>
        <div class="legend-item"><span class="color-dot"
                style="background:#33aaff; box-shadow:0 0 20px #33aaff;"></span> API GATEWAY • Integration</div>
        <div class="legend-item"><span class="color-dot"
                style="background:#ffaa33; box-shadow:0 0 20px #ffaa33;"></span> BUILD TOOL • Pipeline</div>
        <div class="legend-item"><span class="color-dot"
                style="background:#cc33ff; box-shadow:0 0 20px #cc33ff;"></span> TEST ENGINE • QA</div>
        <div class="legend-item"><span class="color-dot"
                style="background:#66ffaa; box-shadow:0 0 20px #66ffaa;"></span> DEPLOYMENT • CD</div>
    </div>
    <div class="instruction">🖱️ DRAG TO EXPLORE • HOVER FOR INFO • CLICK TO SELECT</div>
    <div id="footer">⚡ MICRO FRONTEND TEAM • 3D COMPONENT EXPLORER</div>

    <!-- Import Three.js and OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import ms from './msLib/ms.js';
        await ms.ready();

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. Scene Setup with Tech Background ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1a);

        // Add code-like particle background
        const particleCount = 2000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            // Create a grid-like pattern
            const gridSize = 30;
            particlePositions[i * 3] = (Math.random() - 0.5) * gridSize;
            particlePositions[i * 3 + 1] = (Math.random() - 0.5) * gridSize * 0.6;
            particlePositions[i * 3 + 2] = (Math.random() - 0.5) * gridSize;

            // Green/blue color theme (code-like)
            const colorVal = 0.3 + Math.random() * 0.7;
            particleColors[i * 3] = 0.2;
            particleColors[i * 3 + 1] = 0.8 + Math.random() * 0.2;
            particleColors[i * 3 + 2] = 0.6 + Math.random() * 0.4;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 4, 14);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.4;
        document.body.appendChild(renderer.domElement);

        // --- 2. Controls with Auto-rotate ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.enableZoom = true;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 8;
        controls.maxDistance = 25;
        controls.target.set(0, 1.5, 0);

        // --- 3. Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Main directional light
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Colored point lights
        const colors = [0x3399ff, 0x88ffaa, 0xffaa44, 0xff66aa];
        colors.forEach((color, i) => {
            const light = new THREE.PointLight(color, 0.8, 20);
            const angle = (i / colors.length) * Math.PI * 2;
            light.position.set(Math.cos(angle) * 6, 3, Math.sin(angle) * 6);
            scene.add(light);
        });

        // --- 4. Environment: Grid Floor with Code Pattern ---
        const gridHelper = new THREE.GridHelper(20, 20, 0x3399ff, 0x224488);
        gridHelper.position.y = -0.2;
        scene.add(gridHelper);

        // Floating data rings
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x3399ff,
            emissive: 0x113366,
            transparent: true,
            opacity: 0.3,
            side: THREE.DoubleSide
        });

        const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.8, 0.05, 16, 64), ringMat);
        ring1.rotation.x = Math.PI / 2;
        ring1.position.y = 1.5;
        scene.add(ring1);

        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(4.0, 0.05, 16, 64), ringMat);
        ring2.rotation.z = Math.PI / 3;
        ring2.rotation.x = Math.PI / 3;
        ring2.position.y = 1.8;
        scene.add(ring2);

        // --- 5. Micro Frontend Team Components ---
        const teamComponents = [
            {
                role: 'TEAM LEAD',
                color: 0xff3366,
                icon: '👑',
                desc: 'Architecture • Technical decisions',
                shape: 'crown',
                technologies: ['React', 'Node.js', 'AWS']
            },
            {
                role: 'UI ENGINEER',
                color: 0x33ff99,
                icon: '🎨',
                desc: 'Component Library • Design System',
                shape: 'cube',
                technologies: ['Vue', 'Tailwind', 'Storybook']
            },
            {
                role: 'API GATEWAY',
                color: 0x33aaff,
                icon: '🔌',
                desc: 'Microservices • GraphQL',
                shape: 'gateway',
                technologies: ['GraphQL', 'REST', 'WebSocket']
            },
            {
                role: 'BUILD TOOL',
                color: 0xffaa33,
                icon: '⚙️',
                desc: 'Webpack • Vite • Pipeline',
                shape: 'gear',
                technologies: ['Webpack', 'Vite', 'Babel']
            },
            {
                role: 'TEST ENGINE',
                color: 0xcc33ff,
                icon: '🧪',
                desc: 'Unit • E2E • Integration',
                shape: 'test',
                technologies: ['Jest', 'Cypress', 'Playwright']
            },
            {
                role: 'DEPLOYMENT',
                color: 0x66ffaa,
                icon: '🚀',
                desc: 'CI/CD • Kubernetes • Docker',
                shape: 'rocket',
                technologies: ['GitHub Actions', 'Docker', 'K8s']
            }
        ];

        const menuMeshes = [];
        const radius = 5.0;

        teamComponents.forEach((comp, index) => {
            const angle = (index / teamComponents.length) * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = 1.8 + Math.sin(angle * 2) * 0.8;

            // Group for this component
            const group = new THREE.Group();

            // Create shape based on component type
            let mainShape;

            if (comp.shape === 'crown') {
                // Crown shape (team lead)
                const geo1 = new THREE.ConeGeometry(0.6, 0.4, 5);
                const geo2 = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 6);
                const mat = new THREE.MeshStandardMaterial({ color: comp.color, emissive: comp.color, emissiveIntensity: 0.3 });
                mainShape = new THREE.Group();
                const base = new THREE.Mesh(geo2, mat);
                base.position.y = -0.2;
                mainShape.add(base);
                for (let i = 0; i < 5; i++) {
                    const spike = new THREE.Mesh(geo1, mat);
                    const spikeAngle = (i / 5) * Math.PI * 2;
                    spike.position.set(Math.cos(spikeAngle) * 0.4, 0.3, Math.sin(spikeAngle) * 0.4);
                    spike.rotation.x = 0.2;
                    mainShape.add(spike);
                }
            }
            else if (comp.shape === 'gateway') {
                // Gateway (API) - ring with center
                mainShape = new THREE.Group();
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.1, 8, 24),
                    new THREE.MeshStandardMaterial({ color: comp.color, emissive: comp.color, emissiveIntensity: 0.3 }));
                ring.rotation.x = Math.PI / 2;
                mainShape.add(ring);
                const center = new THREE.Mesh(new THREE.SphereGeometry(0.2),
                    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: comp.color }));
                mainShape.add(center);
            }
            else if (comp.shape === 'gear') {
                // Gear (build tool)
                const gearGeo = new THREE.TorusGeometry(0.6, 0.1, 8, 24);
                const gearMat = new THREE.MeshStandardMaterial({ color: comp.color, emissive: comp.color, emissiveIntensity: 0.3 });
                mainShape = new THREE.Mesh(gearGeo, gearMat);
                mainShape.rotation.x = Math.PI / 2;

                // Add teeth
                const toothGroup = new THREE.Group();
                for (let i = 0; i < 8; i++) {
                    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.3, 0.15),
                        new THREE.MeshStandardMaterial({ color: comp.color }));
                    const toothAngle = (i / 8) * Math.PI * 2;
                    tooth.position.set(Math.cos(toothAngle) * 0.8, 0, Math.sin(toothAngle) * 0.8);
                    toothGroup.add(tooth);
                }
                mainShape.add(toothGroup);
            }
            else if (comp.shape === 'test') {
                // Test tube
                mainShape = new THREE.Group();
                const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.2, 8),
                    new THREE.MeshStandardMaterial({ color: 0xcccccc, emissive: comp.color, emissiveIntensity: 0.2 }));
                tube.position.y = 0.6;
                mainShape.add(tube);
                const liquid = new THREE.Mesh(new THREE.SphereGeometry(0.25),
                    new THREE.MeshStandardMaterial({ color: comp.color, emissive: comp.color, emissiveIntensity: 0.4 }));
                liquid.position.y = 0.8;
                mainShape.add(liquid);
            }
            else if (comp.shape === 'rocket') {
                // Rocket (deployment)
                mainShape = new THREE.Group();
                const body = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.2, 8),
                    new THREE.MeshStandardMaterial({ color: comp.color, emissive: comp.color, emissiveIntensity: 0.3 }));
                body.position.y = 0.6;
                mainShape.add(body);
                const flame = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4),
                    new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0xff4400 }));
                flame.position.y = 0;
                mainShape.add(flame);
            }
            else {
                // Default cube for UI engineer
                mainShape = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8),
                    new THREE.MeshStandardMaterial({ color: comp.color, emissive: comp.color, emissiveIntensity: 0.3 }));
            }

            if (mainShape) {
                mainShape.castShadow = true;
                mainShape.receiveShadow = true;
                group.add(mainShape);
            }

            // Add orbiting data nodes (representing micro frontends)
            for (let i = 0; i < 4; i++) {
                const nodeGeo = new THREE.SphereGeometry(0.1, 4);
                const nodeMat = new THREE.MeshStandardMaterial({ color: comp.color, emissive: comp.color });
                const node = new THREE.Mesh(nodeGeo, nodeMat);
                const nodeAngle = (i / 4) * Math.PI * 2 + index;
                node.position.set(Math.cos(nodeAngle) * 1.2, Math.sin(nodeAngle) * 0.3, Math.sin(nodeAngle) * 1.0);
                group.add(node);
            }

            group.position.set(x, y, z);

            // Add point light
            const light = new THREE.PointLight(comp.color, 0.8, 6);
            light.position.set(x, y, z);
            scene.add(light);

            // Store metadata
            group.userData = {
                role: comp.role,
                desc: comp.desc,
                icon: comp.icon,
                technologies: comp.technologies.join(' • ')
            };

            scene.add(group);
            menuMeshes.push(group);

            // Create floating tech tag
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 96;
            const ctx = canvas.getContext('2d');

            // Dark background with border
            ctx.fillStyle = 'rgba(20,30,50,0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#3399ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);

            // Text
            ctx.font = 'bold 24px "Fira Code", monospace';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = comp.icon === '👑' ? '#ff3366' : '#00aaff';
            ctx.shadowBlur = 10;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(comp.icon + ' ' + comp.role, canvas.width / 2, canvas.height / 2);

            // Small tech indicator
            ctx.font = '14px "Fira Code", monospace';
            ctx.fillStyle = '#88ffaa';
            ctx.shadowBlur = 5;
            ctx.fillText('⚡', canvas.width - 30, canvas.height - 20);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(2.0, 0.8, 1);
            sprite.position.set(x, y - 1.3, z);
            scene.add(sprite);
        });

        // --- 6. Central "Micro Frontend Hub" ---
        const hubGeo = new THREE.IcosahedronGeometry(1.0, 2);
        const hubMat = new THREE.MeshStandardMaterial({
            color: 0x3399ff,
            emissive: 0x114488,
            wireframe: true,
            transparent: true,
            opacity: 0.6
        });
        const hub = new THREE.Mesh(hubGeo, hubMat);
        hub.position.set(0, 1.5, 0);
        hub.castShadow = true;
        scene.add(hub);

        // Floating code snippets around hub
        for (let i = 0; i < 12; i++) {
            const snippetGeo = new THREE.BoxGeometry(0.1, 0.3, 0.1);
            const snippetMat = new THREE.MeshStandardMaterial({ color: 0x88ffaa });
            const snippet = new THREE.Mesh(snippetGeo, snippetMat);
            const angle = (i / 12) * Math.PI * 2;
            snippet.position.set(Math.cos(angle) * 1.5, 1.5 + Math.sin(i) * 0.3, Math.sin(angle) * 1.5);
            scene.add(snippet);
        }

        // --- 7. Raycaster for Interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const statusDiv = document.getElementById('status-panel');

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(menuMeshes, true);

            // Reset all emissive
            menuMeshes.forEach(mesh => {
                mesh.traverse(child => {
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(m => {
                            if (m.emissive) m.emissiveIntensity = 0.3;
                        });
                    }
                });
            });

            if (intersects.length > 0) {
                let hit = intersects[0].object;
                while (hit.parent && !menuMeshes.includes(hit)) {
                    hit = hit.parent;
                }
                if (menuMeshes.includes(hit)) {
                    hit.traverse(child => {
                        if (child.material) {
                            const mats = Array.isArray(child.material) ? child.material : [child.material];
                            mats.forEach(m => {
                                if (m.emissive) m.emissiveIntensity = 1.0;
                            });
                        }
                    });
                    statusDiv.innerHTML = `🔍 ${hit.userData.icon} ${hit.userData.role} • ${hit.userData.desc} [${hit.userData.technologies}]`;
                }
            } else {
                statusDiv.innerHTML = '🚀 Ready • Select a team component';
            }
        });

        window.addEventListener('click', () => {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(menuMeshes, true);

            if (intersects.length > 0) {
                let hit = intersects[0].object;
                while (hit.parent && !menuMeshes.includes(hit)) {
                    hit = hit.parent;
                }
                if (menuMeshes.includes(hit)) {
                    statusDiv.innerHTML = `✅ SELECTED: ${hit.userData.icon} ${hit.userData.role} — ${hit.userData.technologies}`;

                    // Pulse effect
                    hit.traverse(child => {
                        if (child.material) {
                            const mats = Array.isArray(child.material) ? child.material : [child.material];
                            mats.forEach(m => {
                                if (m.emissive) m.emissiveIntensity = 2.0;
                            });
                        }
                    });
                    setTimeout(() => {
                        hit.traverse(child => {
                            if (child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(m => {
                                    if (m.emissive) m.emissiveIntensity = 0.3;
                                });
                            }
                        });
                    }, 200);
                }
            }
        });

        // --- 8. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Rotate particles
            particles.rotation.y += 0.0003;

            // Animate menu items
            menuMeshes.forEach((mesh, i) => {
                mesh.rotation.y += 0.003;
                mesh.rotation.x += 0.001;
            });

            // Rotate hub
            hub.rotation.y += 0.002;
            hub.rotation.x += 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- 9. Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
