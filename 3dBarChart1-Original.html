<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Bar Chart</title>
<style>
  :root{
    --bg: #191c26;
    --panel: #21252f;
    --panel-line: #2f3444;
    --ink: #e9ebf2;
    --ink-dim: #9aa0b4;
    --accent: #e8a33d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, #262b3a 0%, var(--bg) 60%);
    color:var(--ink); font-family:var(--sans);
  }
  .wrap{ max-width:920px; margin:0 auto; padding:28px 20px 40px; }
  header{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  h1{ font-size:19px; font-weight:600; letter-spacing:.2px; margin:0; }
  #chartTitle{ color:var(--ink-dim); font-size:13px; font-family:var(--mono); }

  .stage-shell{
    position:relative;
    background: linear-gradient(180deg, var(--panel), #1c202a);
    border:1px solid var(--panel-line);
    border-radius:14px;
    height:380px;
    overflow:hidden;
    perspective: 1000px;
  }
  .viewport{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    transform-style:preserve-3d;
  }
  #stage{
    position:relative;
    width:1px; height:1px;
    transform-style:preserve-3d;
    transition: transform .35s ease;
  }
  .floor{
    position:absolute; left:50%; top:270px;
    width:640px; height:280px;
    transform: translate(-50%,-50%) rotateX(90deg);
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 32px 32px;
    background-color: rgba(255,255,255,.015);
    border-radius: 8px;
  }
  #bars{ position:absolute; left:0; top:0; transform-style:preserve-3d; }
  .bar3d{ transform-style:preserve-3d; cursor:default; }
  .face{ position:absolute; left:0; top:0; backface-visibility:hidden; }

  .valueTag{
    position:absolute;
    transform-style:preserve-3d;
    font-family:var(--mono); font-size:11px; color:var(--ink);
    background:rgba(0,0,0,.35); padding:2px 6px; border-radius:4px;
    white-space:nowrap; pointer-events:none;
  }

  .controls{
    display:flex; gap:22px; align-items:center; flex-wrap:wrap;
    margin-top:14px; padding:12px 14px;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    font-size:12px; color:var(--ink-dim);
  }
  .controls label{ display:flex; align-items:center; gap:8px; }
  .controls input[type=range]{ width:130px; accent-color: var(--accent); }
  .controls button{
    background:transparent; border:1px solid var(--panel-line); color:var(--ink);
    padding:6px 12px; border-radius:7px; cursor:pointer; font-size:12px;
  }
  .controls button:hover{ border-color:var(--accent); color:var(--accent); }

  #legend{ display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:16px; font-size:13px; }
  .legend-item{ display:flex; align-items:center; gap:8px; color:var(--ink-dim); }
  .legend-item strong{ color:var(--ink); font-family:var(--mono); font-weight:600; }
  .swatch{ width:10px; height:10px; border-radius:2px; display:inline-block; }

  .tester{ margin-top:26px; }
  .tester h2{ font-size:13px; color:var(--ink-dim); font-weight:600; text-transform:uppercase; letter-spacing:.6px; margin:0 0 8px; }
  textarea{
    width:100%; min-height:110px; resize:vertical;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    color:var(--ink); font-family:var(--mono); font-size:12.5px; padding:12px;
  }
  .tester-row{ display:flex; gap:10px; margin-top:10px; align-items:center; }
  .tester-row button{
    background:var(--accent); border:none; color:#20140a; font-weight:600;
    padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .tester-row button:hover{ filter:brightness(1.08); }
  #status{ font-size:12px; font-family:var(--mono); color:var(--ink-dim); }
  #status.err{ color:#e07070; }
  #status.ok{ color:#7fd19a; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>3D Bar Chart</h1>
    <span id="chartTitle">—</span>
  </header>

  <div class="stage-shell">
    <div class="viewport">
      <div id="stage">
        <div class="floor"></div>
        <div id="bars"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <label>Tilt <input id="tiltRange" type="range" min="5" max="70" value="26"></label>
    <label>Spin <input id="spinRange" type="range" min="-180" max="180" value="-22"></label>
    <button id="resetView">Reset view</button>
  </div>

  <div id="legend"></div>

  <div class="tester">
    <h2>Send it new data</h2>
    <textarea id="jsonInput">{"title":"Monthly Signups","labels":["Jan","Feb","Mar","Apr","May"],"values":[42,68,55,90,73]}</textarea>
    <div class="tester-row">
      <button id="applyBtn">Redraw chart</button>
      <span id="status"></span>
    </div>
  </div>
</div>

<script>
(function(){
  var barsEl = document.getElementById('bars');
  var legendEl = document.getElementById('legend');
  var titleEl = document.getElementById('chartTitle');
  var stage = document.getElementById('stage');

  var DEFAULT_COLORS = ['#e8a33d','#3d9a8b','#6c7bd6','#d16b8f','#8fae6e','#4fb6c9'];
  var W = 52, D = 40, GAP = 26, MAXH = 230, FLOORY = 270;

  function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }

  function shade(hex, percent){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    var r = (num>>16)&255, g=(num>>8)&255, b=num&255;
    r = clamp(Math.round(r + (percent/100)*255),0,255);
    g = clamp(Math.round(g + (percent/100)*255),0,255);
    b = clamp(Math.round(b + (percent/100)*255),0,255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function render(data){
    if (!data || !Array.isArray(data.labels) || !Array.isArray(data.values)) {
      throw new Error('data needs "labels" (array) and "values" (array) of the same length');
    }
    if (data.labels.length !== data.values.length) {
      throw new Error('"labels" and "values" must be the same length');
    }

    var labels = data.labels;
    var values = data.values.map(Number);
    var colors = Array.isArray(data.colors) && data.colors.length ? data.colors : DEFAULT_COLORS;
    var maxVal = data.max ? Number(data.max) : Math.max.apply(null, values.concat([1]));

    titleEl.textContent = data.title || ('updated ' + new Date().toLocaleTimeString());

    barsEl.innerHTML = '';
    legendEl.innerHTML = '';

    var n = values.length;
    var totalWidth = n*W + (n-1)*GAP;
    var startX = -totalWidth/2;

    values.forEach(function(v, i){
      var h = Math.max(4, (v / maxVal) * MAXH);
      var x = startX + i*(W+GAP);
      var color = colors[i % colors.length];

      var bar = document.createElement('div');
      bar.className = 'bar3d';
      bar.style.cssText = 'position:absolute; left:' + x + 'px; top:' + (FLOORY - h) + 'px; width:' + W + 'px; height:' + h + 'px;';
      bar.title = (labels[i] != null ? labels[i] : 'Item ' + (i+1)) + ': ' + v;

      bar.innerHTML =
        '<div class="face" style="width:'+W+'px;height:'+h+'px;background:'+color+';transform:translateZ('+(D/2)+'px);"></div>' +
        '<div class="face" style="width:'+W+'px;height:'+h+'px;background:'+shade(color,-22)+';transform:rotateY(180deg) translateZ('+(D/2)+'px);"></div>' +
        '<div class="face" style="width:'+D+'px;height:'+h+'px;background:'+shade(color,-38)+';transform:rotateY(90deg) translateZ('+(W/2)+'px);"></div>' +
        '<div class="face" style="width:'+D+'px;height:'+h+'px;background:'+shade(color,-38)+';transform:rotateY(-90deg) translateZ('+(W/2)+'px);"></div>' +
        '<div class="face" style="width:'+W+'px;height:'+D+'px;background:'+shade(color,25)+';transform:rotateX(90deg) translateZ('+(h/2)+'px);"></div>';

      barsEl.appendChild(bar);

      var legendItem = document.createElement('div');
      legendItem.className = 'legend-item';
      legendItem.innerHTML = '<span class="swatch" style="background:'+color+'"></span>' +
        (labels[i] != null ? labels[i] : 'Item ' + (i+1)) + ': <strong>' + v + '</strong>';
      legendEl.appendChild(legendItem);
    });
  }

  // ---- The function you call from outside to redraw the chart ----
  // Accepts either a JSON string or an already-parsed object.
  // Shape: { title?: string, labels: string[], values: number[], colors?: string[], max?: number }
  window.updateBarChart = function(input){
    var data = (typeof input === 'string') ? JSON.parse(input) : input;
    render(data);
    return true;
  };

  // ---- rotation controls ----
  function applyRotation(){
    var tilt = document.getElementById('tiltRange').value;
    var spin = document.getElementById('spinRange').value;
    stage.style.transform = 'rotateX(' + tilt + 'deg) rotateY(' + spin + 'deg)';
  }
  document.getElementById('tiltRange').addEventListener('input', applyRotation);
  document.getElementById('spinRange').addEventListener('input', applyRotation);
  document.getElementById('resetView').addEventListener('click', function(){
    document.getElementById('tiltRange').value = 26;
    document.getElementById('spinRange').value = -22;
    applyRotation();
  });

  // ---- on-page tester (calls the exact same function) ----
  var statusEl = document.getElementById('status');
  document.getElementById('applyBtn').addEventListener('click', function(){
    var raw = document.getElementById('jsonInput').value;
    try{
      window.updateBarChart(raw);
      statusEl.textContent = 'Chart updated ✓';
      statusEl.className = 'ok';
    }catch(e){
      statusEl.textContent = 'Error: ' + e.message;
      statusEl.className = 'err';
    }
  });

  // initial paint
  applyRotation();
  render(JSON.parse(document.getElementById('jsonInput').value));
})();
</script>
</body>
</html>
