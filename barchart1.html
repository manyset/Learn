<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
  }
}
</script>

<div id="stage">
    <div id="title">3D Sales Chart</div>
    <div id="tooltip"></div>
</div>

<style>
    :host {
        display: block;
        width: 100%;
    }

    #stage {
        position: relative;
        overflow: hidden;
        background: #050816;
        font-family: Arial, sans-serif;
    }

    #stage.standalone {
        position: fixed;
        inset: 0;
    }

    #stage.injected {
        width: 100%;
        height: 70vh;
    }

    #stage canvas {
        display: block;
    }

    #title {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 28px;
        font-weight: bold;
        z-index: 10;
    }

    #tooltip {
        position: absolute;
        display: none;
        padding: 10px 15px;
        background: rgba(0, 0, 0, .8);
        color: white;
        border: 1px solid cyan;
        border-radius: 8px;
        pointer-events: none;
        z-index: 20;
    }
</style>

<script type="module">
    import ms from './msLib/ms.js';
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    await ms.ready();

    /* ==================================================
       Mode detection / container   (MS_COMPONENT_RULES §5)
       ================================================== */

    const stage = ms.id('stage').el;
    const host = stage.getRootNode().host;
    const injected = !!(host && host.__ms_instance && host.__ms_instance.parentRef);
    stage.classList.add(injected ? 'injected' : 'standalone');

    /* ==================================================
       Scene
       ================================================== */

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#050816");

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(8, 7, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.shadowMap.enabled = true;
    stage.appendChild(renderer.domElement);   // was document.body.appendChild

    function resize() {
        const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
    }
    new ResizeObserver(resize).observe(stage);   // was window 'resize'
    resize();

    /* ==================================================
       Controls
       ================================================== */

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 2, 0);

    /* ==================================================
       Lights
       ================================================== */

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(5, 10, 5);
    light.castShadow = true;
    scene.add(light);

    /* ==================================================
       Floor
       ================================================== */

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 30),
        new THREE.MeshStandardMaterial({ color: "#111827" })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(30, 30, 0x00ffff, 0x333333);
    scene.add(grid);

    /* ==================================================
       Chart variables
       ================================================== */

    let bars = [];
    let labels = [];

    const tooltip = ms.id("tooltip");

    function clearChart() {
        bars.forEach(b => scene.remove(b.mesh));
        labels.forEach(l => scene.remove(l));
        bars = [];
        labels = [];
    }

    /* ==================================================
       Text labels
       ================================================== */

    function createLabel(text) {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 64;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "white";
        ctx.font = "bold 32px Arial";
        ctx.textAlign = "center";
        ctx.fillText(text, 128, 40);

        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(1.5, .4, 1);
        return sprite;
    }

    /* ==================================================
       Create bar
       ================================================== */

    function createBar(item, index, total, max) {
        const height = (item.value / max) * 5;

        const geometry = new THREE.BoxGeometry(0.8, height, 0.8);
        const material = new THREE.MeshStandardMaterial({
            color: item.color,
            metalness: .3,
            roughness: .3
        });

        const mesh = new THREE.Mesh(geometry, material);
        const gap = 1.5;

        mesh.position.x = (index - total / 2) * gap;
        mesh.position.y = height / 2;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.scale.y = .01;

        scene.add(mesh);

        const label = createLabel(item.value);
        label.position.set(mesh.position.x, height + .5, 0);
        scene.add(label);
        labels.push(label);

        bars.push({
            mesh, label, height,
            value: item.value,
            name: item.label,
            color: item.color
        });
    }

    /* ==================================================
       Public function
       Exported so ms.inject(...) callers get a working
       ref.setChartData(...) via ms.js's execution surface;
       window global kept for the standalone self-test below.
       ================================================== */

    export function setChartData(data) {
        clearChart();

        ms.id("title").innerHTML = data.title || "3D Chart";

        let max = data.maxValue;
        if (!max) max = Math.max(...data.items.map(x => x.value));

        data.items.forEach((item, index) =>
            createBar(item, index, data.items.length, max)
        );
    }
    window.setChartData = setChartData;

    /* ==================================================
       Hover
       ================================================== */

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener("mousemove", event => {   // was window

        const r = renderer.domElement.getBoundingClientRect();

        mouse.x = ((event.clientX - r.left) / r.width) * 2 - 1;
        mouse.y = -((event.clientY - r.top) / r.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const hit = raycaster.intersectObjects(bars.map(b => b.mesh));

        if (hit.length) {
            const bar = bars.find(b => b.mesh === hit[0].object);

            if (bar) {
                bar.mesh.material.emissive = new THREE.Color(bar.color);

                tooltip.style.display = "block";
                tooltip.innerHTML = bar.name + "<br><b>" + bar.value + "</b>";
                tooltip.style.left = (event.clientX - r.left + 15) + "px";
                tooltip.style.top = (event.clientY - r.top + 15) + "px";
            }
        } else {
            tooltip.style.display = "none";
            bars.forEach(b => b.mesh.material.emissive = new THREE.Color(0x000000));
        }
    });

    /* ==================================================
       Animation
       ================================================== */

    function animate() {
        requestAnimationFrame(animate);

        bars.forEach(b => {
            if (b.mesh.scale.y < 1) b.mesh.scale.y += 0.04;
        });

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    /* ==================================================
       Example data
       ================================================== */

    setChartData({
        title: "Website Traffic",
        items: [
            { label: "Google", value: 500, color: "#00ffff" },
            { label: "Direct", value: 300, color: "#ff9900" },
            { label: "Social", value: 450, color: "#ff3399" }
        ]
    });
</script>
