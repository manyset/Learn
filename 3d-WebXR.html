<ms-public>
  <functions>enterVR, exitVR, resetScene, toggleAnimation</functions>
</ms-public>

<div id="compRoot" class="comp-root">
  <div id="canvas-container" class="canvas-container"></div>

  <div class="controls-panel" id="controlsPanel">
    <button class="ctrl-btn" id="btnReset" title="Reset View">🔄</button>
    <button class="ctrl-btn" id="btnToggleAnim" title="Toggle Animation">⏯️</button>
    <button class="ctrl-btn" id="btnEnterVR" title="Enter VR (requires HTTPS)">🥽</button>
  </div>

  <div class="toast" id="toast"></div>

  <style>
    .comp-root {
      position: relative;
      width: 100%;
      min-height: 500px;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .comp-root * {
      box-sizing: border-box;
    }

    .comp-root .canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .comp-root .canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .comp-root .controls-panel {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comp-root .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      outline: none;
    }

    .comp-root .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.08);
    }

    .comp-root .ctrl-btn:active {
      transform: scale(0.95);
    }

    .comp-root .toast {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 30;
      background: rgba(108, 92, 231, 0.95);
      color: #fff;
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .comp-root .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      .comp-root .controls-panel {
        bottom: 14px;
        right: 14px;
        gap: 8px;
      }

      .comp-root .ctrl-btn {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }
    }
  </style>

  <!--
    External dependencies (CDN):
    - Three.js 0.160.0: https://unpkg.com/three@0.160.0/build/three.module.js
    - OrbitControls: https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js
    - XRControllerModelFactory: https://unpkg.com/three@0.160.0/examples/jsm/webxr/XRControllerModelFactory.js
    
    WebXR requires a secure context (https:// or localhost).
    For offline/local deployment, replace import map URLs with local file paths.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { XRControllerModelFactory } from "three/addons/webxr/XRControllerModelFactory.js";

    import ms from "./ms.js";
    await ms.ready();

    // ─── Get component elements using ms.id() ───
    const root = ms.id("compRoot");
    const container = ms.id("canvas-container");
    const btnReset = ms.id("btnReset");
    const btnToggleAnim = ms.id("btnToggleAnim");
    const btnEnterVR = ms.id("btnEnterVR");
    const toast = ms.id("toast");

    // ─── Check WebXR support ───
    let webXRSupported = false;

    async function checkWebXRSupport() {
      if ('xr' in navigator) {
        try {
          webXRSupported = await navigator.xr.isSessionSupported('immersive-vr');
        } catch (e) {
          webXRSupported = false;
        }
      }
    }
    checkWebXRSupport();

    // ─── Scene ───
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0a0a1a');
    scene.fog = new THREE.FogExp2('#0a0a1a', 0.0003);

    // ─── Renderer ───
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    // ─── Camera ───
    const camera = new THREE.PerspectiveCamera(60, 2, 0.1, 200);
    camera.position.set(8, 5, 12);

    // ─── Orbit Controls ───
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 3;
    controls.maxDistance = 30;
    controls.target.set(0, 1.5, 0);
    controls.maxPolarAngle = Math.PI * 0.7;
    controls.update();

    // ─── Lighting ───
    scene.add(new THREE.AmbientLight('#334466', 2.5));
    scene.add(new THREE.HemisphereLight('#8899cc', '#223344', 1.8));

    const mainLight = new THREE.DirectionalLight('#ffffff', 6);
    mainLight.position.set(10, 18, 8);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 60;
    mainLight.shadow.camera.left = -20;
    mainLight.shadow.camera.right = 20;
    mainLight.shadow.camera.top = 20;
    mainLight.shadow.camera.bottom = -20;
    mainLight.shadow.bias = -0.0001;
    scene.add(mainLight);

    const pointLight1 = new THREE.PointLight('#ff6b6b', 80, 12);
    pointLight1.position.set(4, 3, 4);
    pointLight1.castShadow = true;
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight('#4ecdc4', 80, 12);
    pointLight2.position.set(-4, 2, -3);
    pointLight2.castShadow = true;
    scene.add(pointLight2);

    const pointLight3 = new THREE.PointLight('#a29bfe', 60, 10);
    pointLight3.position.set(0, 6, 0);
    pointLight3.castShadow = true;
    scene.add(pointLight3);

    // ─── Ground ───
    const groundGeo = new THREE.CircleGeometry(12, 64);
    const groundMat = new THREE.MeshStandardMaterial({ color: '#1a1a35', roughness: 0.5, metalness: 0.3 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    ground.receiveShadow = true;
    scene.add(ground);

    // Ring
    const ringGeo = new THREE.TorusGeometry(6, 0.05, 16, 100);
    const ringMat = new THREE.MeshStandardMaterial({ color: '#4ecdc4', roughness: 0.3, metalness: 0.6, emissive: '#003333', emissiveIntensity: 0.8 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.02;
    ring.receiveShadow = true;
    scene.add(ring);

    // ─── Track disposable resources ───
    const disposableGeometries = [];
    const disposableMaterials = [];

    // ─── Floating shapes ───
    const objectsGroup = new THREE.Group();
    scene.add(objectsGroup);
    const clickableObjects = [];

    function createShape(geometry, matOpts, pos, colorHex) {
      const material = new THREE.MeshStandardMaterial({
        color: new THREE.Color(colorHex),
        roughness: 0.25,
        metalness: 0.15,
        ...matOpts
      });
      disposableMaterials.push(material);

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(pos);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = {
        originalY: pos.y,
        colorHex,
        floatOffset: Math.random() * Math.PI * 2,
        floatSpeed: 0.6 + Math.random() * 1.2,
        rotateSpeed: 0.2 + Math.random() * 0.6,
      };

      const wireGeo = new THREE.EdgesGeometry(geometry, 30);
      disposableGeometries.push(wireGeo);
      const wireMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(colorHex).multiplyScalar(1.5),
        transparent: true, opacity: 0.3,
      });
      disposableMaterials.push(wireMat);
      mesh.add(new THREE.LineSegments(wireGeo, wireMat));

      objectsGroup.add(mesh);
      clickableObjects.push(mesh);
      return mesh;
    }

    const crystalGeo = new THREE.IcosahedronGeometry(1.2, 0);
    disposableGeometries.push(crystalGeo);
    createShape(crystalGeo, { roughness: 0.1, metalness: 0.5, emissive: '#6c5ce7', emissiveIntensity: 0.6 }, new THREE.Vector3(0, 2.5, 0), '#a29bfe');

    const tetraGeo = new THREE.TetrahedronGeometry(0.6, 0);
    disposableGeometries.push(tetraGeo);
    createShape(tetraGeo, { roughness: 0.2, metalness: 0.4 }, new THREE.Vector3(2.5, 1.8, 2), '#ff6b6b');

    const octaGeo = new THREE.OctahedronGeometry(0.55, 0);
    disposableGeometries.push(octaGeo);
    createShape(octaGeo, { roughness: 0.2, metalness: 0.4 }, new THREE.Vector3(-2.8, 2.2, -1.5), '#4ecdc4');

    const dodecGeo = new THREE.DodecahedronGeometry(0.5, 0);
    disposableGeometries.push(dodecGeo);
    createShape(dodecGeo, { roughness: 0.15, metalness: 0.5 }, new THREE.Vector3(1.5, 1.2, -3), '#f9ca24');

    const torusKnotGeo = new THREE.TorusKnotGeometry(0.4, 0.12, 64, 8);
    disposableGeometries.push(torusKnotGeo);
    createShape(torusKnotGeo, { roughness: 0.2, metalness: 0.5, emissive: '#ff9f43', emissiveIntensity: 0.3 }, new THREE.Vector3(-1.5, 3, 2.5), '#ff9f43');

    const coneGeo = new THREE.ConeGeometry(0.45, 1, 6);
    disposableGeometries.push(coneGeo);
    createShape(coneGeo, { roughness: 0.3, metalness: 0.3 }, new THREE.Vector3(3.5, 1.5, -2), '#fd79a8');

    // ─── Particles ───
    const particlesGroup = new THREE.Group();
    scene.add(particlesGroup);
    const particlesCount = 200;
    const particlesGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(particlesCount * 3);
    const colArray = new Float32Array(particlesCount * 3);
    const particleData = [];

    for (let i = 0; i < particlesCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 3 + Math.random() * 10;
      const h = -2 + Math.random() * 10;
      posArray[i * 3] = Math.cos(angle) * radius;
      posArray[i * 3 + 1] = h;
      posArray[i * 3 + 2] = Math.sin(angle) * radius;
      const c = new THREE.Color().setHSL(Math.random(), 0.8, 0.6 + Math.random() * 0.3);
      colArray[i * 3] = c.r;
      colArray[i * 3 + 1] = c.g;
      colArray[i * 3 + 2] = c.b;
      particleData.push({ baseX: posArray[i * 3], baseZ: posArray[i * 3 + 2], speed: 0.1 + Math.random() * 0.3, offset: Math.random() * Math.PI * 2 });
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeo.setAttribute('color', new THREE.BufferAttribute(colArray, 3));
    const particlesMat = new THREE.PointsMaterial({
      size: 0.06, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.7,
    });
    disposableMaterials.push(particlesMat);
    const particles = new THREE.Points(particlesGeo, particlesMat);
    particlesGroup.add(particles);

    // ─── VR Controllers ───
    const controllerModelFactory = new XRControllerModelFactory();
    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);
      controller.addEventListener('selectstart', () => { controller.userData.selectPressed = true; });
      controller.addEventListener('selectend', () => { controller.userData.selectPressed = false; });
      scene.add(controller);
      const grip = renderer.xr.getControllerGrip(i);
      grip.add(controllerModelFactory.createControllerModel(grip));
      scene.add(grip);
    }

    // ─── Click interaction on canvas ───
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    container.addEventListener('click', (event) => {
      const rect = container.el.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersections = raycaster.intersectObjects(clickableObjects);
      if (intersections.length > 0) {
        const obj = intersections[0].object;
        showToast(`✨ ${obj.userData.colorHex} shape!`);
        const orig = obj.scale.clone();
        const start = performance.now();
        function pulse(t) {
          const e = (t - start) / 1000;
          if (e < 0.4) {
            obj.scale.setScalar(1 + Math.sin(e * Math.PI * 5) * 0.2 * (1 - e / 0.4));
            requestAnimationFrame(pulse);
          } else {
            obj.scale.copy(orig);
          }
        }
        requestAnimationFrame(pulse);
      }
    });

    // ─── Toast ───
    let toastTimer;
    function showToast(msg) {
      if (toastTimer) clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ─── Animation state ───
    let isAnimating = true;
    const clock = new THREE.Clock();

    // ─── Size management from container ───
    function resizeChart() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resizeChart();

    const resizeObserver = new ResizeObserver(resizeChart);
    resizeObserver.observe(container.el);

    // ─── Render loop (XR animation loop) ───
    function render() {
      const delta = clock.getDelta();
      const time = performance.now() * 0.001;

      if (isAnimating) {
        objectsGroup.children.forEach(child => {
          if (child.userData?.floatOffset !== undefined) {
            child.position.y = child.userData.originalY + Math.sin(time * child.userData.floatSpeed + child.userData.floatOffset) * 0.5;
            child.rotation.y += delta * child.userData.rotateSpeed;
            child.rotation.x += delta * child.userData.rotateSpeed * 0.3;
          }
        });
        for (let i = 0; i < particlesCount; i++) {
          const pd = particleData[i];
          posArray[i * 3] = pd.baseX + Math.sin(time * pd.speed + pd.offset) * 1.5;
          posArray[i * 3 + 2] = pd.baseZ + Math.cos(time * pd.speed + pd.offset) * 1.5;
        }
        particlesGeo.attributes.position.needsUpdate = true;
        particles.rotation.y += delta * 0.08;
        pointLight1.intensity = 60 + Math.sin(time * 1.5) * 25;
        pointLight2.intensity = 60 + Math.cos(time * 1.8) * 25;
        pointLight3.intensity = 45 + Math.sin(time * 2.2) * 20;
        ring.rotation.z += delta * 0.2;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(render);

    // ─── VR session events ───
    renderer.xr.addEventListener('sessionstart', () => {
      controls.enabled = false;
      showToast('🥽 VR Started');
    });
    renderer.xr.addEventListener('sessionend', () => {
      controls.enabled = true;
      showToast('👋 Back to 3D');
    });

    // ─── Public functions (exported for MS) ───
    export async function enterVR() {
      if (!webXRSupported) {
        showToast('⚠️ Needs HTTPS + supported device');
        return;
      }
      if (renderer.xr.isPresenting) return;
      try {
        const session = await navigator.xr.requestSession('immersive-vr', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['bounded-floor']
        });
        await renderer.xr.setSession(session);
      } catch (e) {
        showToast('⚠️ VR start failed');
      }
    }

    export function exitVR() {
      const session = renderer.xr.getSession();
      if (session) session.end();
    }

    export function resetScene() {
      camera.position.set(8, 5, 12);
      controls.target.set(0, 1.5, 0);
      controls.update();
      showToast('🔄 View Reset');
    }

    export function toggleAnimation() {
      isAnimating = !isAnimating;
      showToast(isAnimating ? '▶️ Animation On' : '⏸️ Animation Paused');
      btnToggleAnim.textContent = isAnimating ? '⏯️' : '▶️';
    }

    // ─── Button handlers ───
    btnEnterVR.addEventListener('click', enterVR);
    btnReset.addEventListener('click', resetScene);
    btnToggleAnim.addEventListener('click', toggleAnimation);

    // ─── Keyboard shortcuts on root ───
    root.setAttribute("tabindex", "0");
    root.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch (e.key.toLowerCase()) {
        case 'v': enterVR(); break;
        case 'r': resetScene(); break;
        case ' ': e.preventDefault(); toggleAnimation(); break;
        case 'escape': exitVR(); break;
      }
    });

    // ─── Cleanup ───
    function onClose() {
      renderer.setAnimationLoop(null);

      const session = renderer.xr.getSession?.();
      if (session) session.end();

      resizeObserver?.disconnect();

      if (toastTimer) clearTimeout(toastTimer);

      disposableGeometries.forEach(g => g.dispose());
      disposableMaterials.forEach(m => m.dispose());
      disposableGeometries.length = 0;
      disposableMaterials.length = 0;

      while (objectsGroup.children.length) {
        const child = objectsGroup.children[0];
        if (child.geometry && !disposableGeometries.includes(child.geometry)) {
          child.geometry.dispose();
        }
        if (child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
        }
        objectsGroup.remove(child);
      }
      clickableObjects.length = 0;

      controls?.dispose();
      renderer?.dispose();
      if (renderer?.domElement) renderer.domElement.remove();
    }

    console.log('🌐 3D WebXR ready (MS-compatible). Drag to rotate, scroll to zoom, click shapes. Press V for VR.');
  </script>
</div>
