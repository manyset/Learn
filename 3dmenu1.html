<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Creative Menu System • Holographic • Interactive</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', 'Segoe UI', sans-serif;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
            background: rgba(0, 10, 20, 0.6);
            padding: 8px 24px;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            z-index: 100;
            font-size: 1.1rem;
            letter-spacing: 2px;
            pointer-events: none;
        }

        #instruction {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            border: 1px solid #ffaa88;
            z-index: 100;
            pointer-events: none;
        }

        .menu-title {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 12px;
            z-index: 50;
            text-shadow: 0 0 30px cyan, 0 0 60px blue;
            opacity: 0.4;
            pointer-events: none;
            white-space: nowrap;
        }

        .status {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #afa;
            background: rgba(0, 20, 0, 0.6);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
            border: 1px solid #afa;
            z-index: 100;
        }
    </style>
</head>

<body>
    <div id="info">🌀 HOLO MENU • 3D INTERACTIVE</div>
    <div class="menu-title">DIMENSIONS</div>
    <div id="instruction">🖱️ Hover cubes • Click to select • Drag to rotate view</div>
    <div class="status" id="statusDisplay">✨ Ready</div>

    <!-- Import Three.js and OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. Setup Scene with futuristic feel ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510); // deep space

        // Add subtle fog for depth
        scene.fog = new THREE.FogExp2(0x050510, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 4, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true; // for style
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- 2. Controls (allow rotation but limit to keep menu in view) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.enableZoom = true;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 5;
        controls.maxDistance = 25;
        controls.target.set(0, 1, 0);

        // --- 3. Lighting for holographic effect ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Main colored lights
        const light1 = new THREE.PointLight(0x4466ff, 1, 30);
        light1.position.set(5, 8, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xff66aa, 1, 30);
        light2.position.set(-5, 3, -5);
        scene.add(light2);

        const light3 = new THREE.PointLight(0x66ffaa, 0.8, 30);
        light3.position.set(3, 2, -8);
        scene.add(light3);

        // Add a central subtle glow sphere
        const glowSphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const glowSphereMat = new THREE.MeshStandardMaterial({
            color: 0x3355aa,
            emissive: 0x112266,
            transparent: true,
            opacity: 0.2
        });
        const glowSphere = new THREE.Mesh(glowSphereGeo, glowSphereMat);
        glowSphere.position.set(0, 1, 0);
        scene.add(glowSphere);

        // --- 4. Create floating menu items (creative 3D cubes with inner glow) ---

        // Menu data: each item has label, color, position, description
        const menuItems = [
            { label: 'HOME', color: 0x44aaff, pos: [-3, 2.5, -2], desc: 'Main Dashboard' },
            { label: 'GALLERY', color: 0xff44aa, pos: [3, 2.2, -2.5], desc: '3D Art Showcase' },
            { label: 'SETTINGS', color: 0xaaff44, pos: [0, 1.8, 3.5], desc: 'Preferences & Tools' },
            { label: 'PROFILE', color: 0xffaa44, pos: [-2.5, 1.2, 3], desc: 'User Identity' },
            { label: 'CLOUD', color: 0xaa88ff, pos: [2.8, 1.5, 2.2], desc: 'Sync & Storage' },
            { label: 'LABS', color: 0xff6688, pos: [-1, 3.2, -1], desc: 'Experimental' }
        ];

        // Store cubes for raycasting
        const menuCubes = [];

        // Create a glowing ring for each cube
        menuItems.forEach((item) => {
            const group = new THREE.Group();

            // Main cube with transparent material
            const geo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
            const mat = new THREE.MeshStandardMaterial({
                color: item.color,
                emissive: item.color,
                emissiveIntensity: 0.3,
                transparent: true,
                opacity: 0.7,
                wireframe: false
            });
            const cube = new THREE.Mesh(geo, mat);
            cube.castShadow = true;
            cube.receiveShadow = true;
            group.add(cube);

            // Inner glowing cube (smaller)
            const innerGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const innerMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: item.color,
                emissiveIntensity: 0.8,
                transparent: true,
                opacity: 0.9
            });
            const innerCube = new THREE.Mesh(innerGeo, innerMat);
            innerCube.castShadow = true;
            group.add(innerCube);

            // Floating particles around each cube (mini stars)
            const particleCount = 8;
            const particleGeo = new THREE.BufferGeometry();
            const particlePos = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                const angle = (i / particleCount) * Math.PI * 2;
                const radius = 1.1;
                particlePos[i * 3] = Math.cos(angle) * radius;
                particlePos[i * 3 + 1] = Math.sin(angle) * radius * 0.5;
                particlePos[i * 3 + 2] = Math.sin(angle * 2) * 0.3;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
            const particleMat = new THREE.PointsMaterial({
                color: item.color,
                size: 0.08,
                blending: THREE.AdditiveBlending
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            group.add(particles);

            // Text label using canvas texture (simple sprite)
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'Bold 28px "Segoe UI", Arial';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(item.label, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthTest: true
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(1.2, 0.6, 1);
            sprite.position.set(0, 1.2, 0);
            group.add(sprite);

            group.position.set(item.pos[0], item.pos[1], item.pos[2]);

            // Store metadata
            group.userData = {
                label: item.label,
                desc: item.desc,
                color: item.color,
                basePos: item.pos.slice()
            };

            scene.add(group);
            menuCubes.push(group);
        });

        // --- 5. Add floating orbs / background ambiance ---
        const orbCount = 50;
        const orbGeo = new THREE.BufferGeometry();
        const orbPositions = new Float32Array(orbCount * 3);
        const orbColors = new Float32Array(orbCount * 3);
        for (let i = 0; i < orbCount; i++) {
            const r = 10 + Math.random() * 15;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            orbPositions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            orbPositions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r * 0.5;
            orbPositions[i * 3 + 2] = Math.cos(phi) * r;

            const col = new THREE.Color().setHSL(Math.random(), 0.8, 0.6);
            orbColors[i * 3] = col.r;
            orbColors[i * 3 + 1] = col.g;
            orbColors[i * 3 + 2] = col.b;
        }
        orbGeo.setAttribute('position', new THREE.BufferAttribute(orbPositions, 3));
        orbGeo.setAttribute('color', new THREE.BufferAttribute(orbColors, 3));

        const orbMat = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const orbs = new THREE.Points(orbGeo, orbMat);
        scene.add(orbs);

        // --- 6. Add a grid floor with glow ---
        const gridHelper = new THREE.GridHelper(20, 20, 0x44aaff, 0x335588);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        // Add floating rings around center
        const ringGeo = new THREE.TorusGeometry(2.5, 0.05, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x224488 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 1;
        scene.add(ring);

        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(3.8, 0.05, 16, 100), ringMat);
        ring2.rotation.z = Math.PI / 3;
        ring2.rotation.x = Math.PI / 3;
        ring2.position.y = 1.2;
        scene.add(ring2);

        // --- 7. Raycaster for interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Mouse move for hover effect
        window.addEventListener('mousemove', (event) => {
            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Click handler
        window.addEventListener('click', () => {
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(menuCubes, true); // true for recursive

            if (intersects.length > 0) {
                // Find the top-level group (menu cube)
                let selectedObj = intersects[0].object;
                while (selectedObj.parent && !menuCubes.includes(selectedObj)) {
                    selectedObj = selectedObj.parent;
                }
                if (menuCubes.includes(selectedObj)) {
                    const data = selectedObj.userData;
                    ms.id('statusDisplay').innerHTML = `✅ Selected: ${data.label} — ${data.desc}`;

                    // Pulse effect
                    selectedObj.children[0].material.emissiveIntensity = 1.0;
                    setTimeout(() => {
                        if (selectedObj.children[0]) selectedObj.children[0].material.emissiveIntensity = 0.3;
                    }, 200);
                }
            }
        });

        // --- 8. Animation loop with dynamic effects ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() / 1000;

            // Rotate background orbs slowly
            orbs.rotation.y += 0.0005;
            orbs.rotation.x += 0.0002;

            // Animate menu cubes: gentle floating
            menuCubes.forEach((cube, index) => {
                // Bob up and down
                cube.position.y = cube.userData.basePos[1] + Math.sin(elapsedTime * 1.5 + index) * 0.3;
                // Rotate slowly
                cube.rotation.y += 0.005;
                cube.rotation.x = Math.sin(elapsedTime * 0.5 + index) * 0.1;
            });

            // Hover effect with raycasting (highlight)
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(menuCubes, true);

            // Reset all cubes to normal
            menuCubes.forEach(cube => {
                cube.children.forEach(child => {
                    if (child.material && !Array.isArray(child.material)) {
                        if (child.material.emissive) {
                            child.material.emissiveIntensity = 0.3;
                        }
                    } else if (Array.isArray(child.material)) {
                        child.material.forEach(m => {
                            if (m.emissive) m.emissiveIntensity = 0.3;
                        });
                    }
                });
            });

            // Highlight hovered
            if (intersects.length > 0) {
                let hoveredObj = intersects[0].object;
                while (hoveredObj.parent && !menuCubes.includes(hoveredObj)) {
                    hoveredObj = hoveredObj.parent;
                }
                if (menuCubes.includes(hoveredObj)) {
                    hoveredObj.children.forEach(child => {
                        if (child.material && !Array.isArray(child.material)) {
                            if (child.material.emissive) {
                                child.material.emissiveIntensity = 0.8;
                            }
                        } else if (Array.isArray(child.material)) {
                            child.material.forEach(m => {
                                if (m.emissive) m.emissiveIntensity = 0.8;
                            });
                        }
                    });
                    ms.id('statusDisplay').innerHTML = `🔍 Hover: ${hoveredObj.userData.label}`;
                }
            } else {
                if (!intersects.length) {
                    ms.id('statusDisplay').innerHTML = '✨ Ready';
                }
            }

            controls.update(); // for auto-rotate
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // --- 9. Resize handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 10. Add some floating particles around camera (just for fun) ---
        const camParticlesGeo = new THREE.BufferGeometry();
        const camParticlesCount = 100;
        const camPositions = new Float32Array(camParticlesCount * 3);
        for (let i = 0; i < camParticlesCount; i++) {
            camPositions[i * 3] = (Math.random() - 0.5) * 30;
            camPositions[i * 3 + 1] = (Math.random() - 0.5) * 20;
            camPositions[i * 3 + 2] = (Math.random() - 0.5) * 30;
        }
        camParticlesGeo.setAttribute('position', new THREE.BufferAttribute(camPositions, 3));
        const camParticlesMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.05, transparent: true, blending: THREE.AdditiveBlending });
        const camParticles = new THREE.Points(camParticlesGeo, camParticlesMat);
        scene.add(camParticles);
    </script>
</body>

</html>
