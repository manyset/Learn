<ms-public>
    <functions>getSelected</functions>

</ms-public>

<style>
    .comp-root {
        --navy: #16205C;
        --navy-dark: #0F1740;
        --blue-link: #1C56C4;
        --border: #E3E6EC;
        --text: #2B2E36;
        --muted: #8A8F98;
        --row-highlight: #EEF0F4;
        --reset-bg: #E9EBEF;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
        padding: 24px;
        background: #fff;
    }

    .comp-root * {
        box-sizing: border-box;
    }

    .comp-root .filter-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .comp-root .filter-by-label {
        color: var(--blue-link);
        font-weight: 600;
        font-size: 15px;
    }

    .comp-root .pill-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .comp-root .tab-wrap {
        position: relative;
    }

    .comp-root .tab-btn {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--navy);
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
    }

    .comp-root .tab-btn.has-selection::after {
        content: "";
        position: absolute;
        top: -2px;
        right: -2px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #37D18C;
        border: 2px solid #fff;
    }

    .comp-root .tab-btn .chev {
        width: 12px;
        height: 12px;
        transition: transform .15s ease;
    }

    .comp-root .tab-btn.open .chev {
        transform: rotate(180deg);
    }

    .comp-root .reset-btn {
        background: var(--reset-bg);
        color: var(--blue-link);
        border: none;
        padding: 10px 20px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
    }

    .comp-root .reset-btn:hover {
        background: #dfe2e8;
    }

    .comp-root .tab-panel {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        padding-top: 8px;
        min-width: 280px;
        z-index: 20;
    }

    .comp-root .tab-panel.open {
        display: block;
    }

    .comp-root .tab-panel .panel-inner {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 10px 28px rgba(20, 25, 50, 0.16);
        overflow: hidden;
    }

    .comp-root .opt-list {
        padding: 6px 0;
    }

    .comp-root .opt-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        font-size: 14px;
        color: var(--muted);
        cursor: pointer;
    }

    .comp-root .opt-row:hover {
        background: var(--row-highlight);
    }

    .comp-root .opt-row.checked {
        background: var(--row-highlight);
        color: var(--text);
    }

    .comp-root .opt-row input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--navy);
        cursor: pointer;
    }

    .comp-root .panel-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
    }

    .comp-root .btn-cancel {
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 13.5px;
        padding: 8px 14px;
        cursor: pointer;
        font-family: inherit;
    }

    .comp-root .btn-ok {
        background: var(--navy);
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 13.5px;
        padding: 8px 22px;
        cursor: pointer;
        font-family: inherit;
    }

    .comp-root .btn-ok:hover {
        background: var(--navy-dark);
    }
</style>

<div id="compRoot" class="comp-root">
    <div class="filter-toolbar">
        <span class="filter-by-label">Filter By :</span>
        <div class="pill-row" id="pillRow"></div>
        <button class="reset-btn" id="resetBtn" type="button">Reset</button>
    </div>
</div>

<ms-public>
    <functions>getSelected, resetAll, onClose</functions>
</ms-public>

<script type="module" src="./TabScreen1.js"></script>
