export async function FillGrid(rowcount) {
   
 // if (rowcount==null) rowcount=4;
  alert("FillGrid started with rowcount: " + rowcount);

  const host = ms.id("Fixedcontainer1");
   // 🔑 attach early. MS Need This way...!!!
  const table = document.createElement("div");
  table.className = "table"; // "table";

  try {
  host.appendChild(table);   // 🔑 attach early. MS Need This way...!!!
  }
   catch { alert("er1"); }

  for (let r = 0; r < rowcount; r++) {
    const row = document.createElement("div");
    row.className = "row";
    try {
    table.appendChild(row);
     }
      catch { alert("er2"); }

    // filling 2 fields
    for (let col = 0; col < 2; col++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      try {
      row.appendChild(cell);
      }
      catch { alert("er"); }

      if (col==0) cell.innerHTML="field 1"; else cell.innerHTML="field 2";
      const o = await ms.inject("TextBox1", cell);
      let v1 = o.SetVal('225'); // can use await
       // let c = await ms.call(o,'SetVal',224); // SHOULD WORK
      let v2 = o.txt1.value +1;
      o.SetVal(v2);
      let x=0;
    }
  }
  
}
