<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Maldives Map - Interactive WebGL</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a1628;
    }
    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(10, 22, 40, 0.85);
      backdrop-filter: blur(15px);
      color: white;
      padding: 15px 25px;
      border-radius: 20px;
      border: 1px solid rgba(0, 180, 216, 0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 10;
    }
    #info-panel h1 {
      margin: 0 0 5px;
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00b4d8, #90e0ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }
    #info-panel p {
      margin: 0;
      font-size: 0.85rem;
      color: #b0c8e0;
    }
    #island-tooltip {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 20, 40, 0.9);
      backdrop-filter: blur(10px);
      color: #e0f0ff;
      padding: 12px 28px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      border: 1px solid rgba(0, 180, 216, 0.6);
      display: none;
      z-index: 15;
      white-space: nowrap;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    #controls-panel {
      position: absolute;
      bottom: 30px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .action-btn {
      background: rgba(10, 25, 45, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 180, 216, 0.4);
      color: #c8e0ff;
      padding: 14px 22px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      text-transform: uppercase;
    }
    .action-btn:hover {
      background: rgba(0, 100, 180, 0.5);
      border-color: #00b4d8;
      color: white;
      box-shadow: 0 0 20px rgba(0, 180, 216, 0.5);
      transform: translateX(-3px);
    }
    .action-btn.active {
      background: #0077b6;
      border-color: #00b4d8;
      color: white;
      box-shadow: 0 0 25px rgba(0, 180, 216, 0.7);
    }
    #legend {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(10, 22, 40, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 15px;
      color: #c8d8f0;
      font-size: 0.8rem;
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 10;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    @media (max-width: 700px) {
      #info-panel {
        padding: 10px 18px;
        top: 10px;
      }
      .action-btn {
        padding: 10px 16px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div id="info-panel">
    <h1>🇲🇻 MALDIVES</h1>
    <p>26 Atolls • 1,192 Islands • Indian Ocean</p>
  </div>

  <div id="legend">
    <div class="legend-item"><span class="legend-color" style="background:#00b4d8;"></span> Major Atoll</div>
    <div class="legend-item"><span class="legend-color" style="background:#f4a261;"></span> Capital Malé</div>
    <div class="legend-item"><span class="legend-color" style="background:#e9c46a;"></span> Resort Island</div>
    <div class="legend-item"><span class="legend-color" style="background:#90e0ef;"></span> Local Island</div>
  </div>

  <div id="island-tooltip">🏝️ Click an island</div>

  <div id="controls-panel">
    <button id="btn-rotate" class="action-btn active">🔄 Auto Rotate</button>
    <button id="btn-waves" class="action-btn active">🌊 Ocean Waves</button>
    <button id="btn-labels" class="action-btn">🏷️ Atoll Names</button>
    <button id="btn-reset" class="action-btn">🎯 Reset View</button>
    <button id="btn-fly" class="action-btn">✈️ Fly to Malé</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ---------- SCENE SETUP ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1628);
    scene.fog = new THREE.FogExp2(0x0a1628, 0.00015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 200);
    camera.position.set(18, 14, 22);
    camera.lookAt(0, 0, 0);

    // WebGL Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // CSS2 Renderer for labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.8, 0);
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 6;
    controls.maxDistance = 55;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.update();

    // ---------- LIGHTING ----------
    const ambientLight = new THREE.AmbientLight(0x334466);
    scene.add(ambientLight);
    
    const sunLight = new THREE.DirectionalLight(0xffeedd, 1.3);
    sunLight.position.set(15, 20, 10);
    sunLight.castShadow = true;
    sunLight.receiveShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 60;
    sunLight.shadow.camera.left = -20;
    sunLight.shadow.camera.right = 20;
    sunLight.shadow.camera.top = 20;
    sunLight.shadow.camera.bottom = -15;
    scene.add(sunLight);

    const fillLight = new THREE.PointLight(0x4488cc, 0.6);
    fillLight.position.set(-8, 5, -5);
    scene.add(fillLight);

    // ---------- OCEAN FLOOR ----------
    const oceanFloorGeo = new THREE.CircleGeometry(22, 64);
    const oceanFloorMat = new THREE.MeshStandardMaterial({ 
      color: 0x0b1a30, 
      roughness: 0.9, 
      metalness: 0.2 
    });
    const oceanFloor = new THREE.Mesh(oceanFloorGeo, oceanFloorMat);
    oceanFloor.rotation.x = -Math.PI / 2;
    oceanFloor.position.y = -2.2;
    oceanFloor.receiveShadow = true;
    scene.add(oceanFloor);

    // ---------- DYNAMIC OCEAN SURFACE ----------
    const oceanGeometry = new THREE.CircleGeometry(21, 80);
    const oceanMaterial = new THREE.MeshPhongMaterial({
      color: 0x1a759f,
      emissive: new THREE.Color(0x051525),
      shininess: 30,
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide
    });
    const oceanSurface = new THREE.Mesh(oceanGeometry, oceanMaterial);
    oceanSurface.rotation.x = -Math.PI / 2;
    oceanSurface.position.y = -0.4;
    oceanSurface.receiveShadow = true;
    oceanSurface.name = "oceanSurface";
    scene.add(oceanSurface);

    // Wave particles on ocean
    const waveParticlesGeo = new THREE.BufferGeometry();
    const waveCount = 600;
    const wavePositions = new Float32Array(waveCount * 3);
    for (let i = 0; i < waveCount * 3; i += 3) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 4 + Math.random() * 17;
      wavePositions[i] = Math.cos(angle) * radius;
      wavePositions[i+1] = -0.35 + Math.random() * 0.15;
      wavePositions[i+2] = Math.sin(angle) * radius;
    }
    waveParticlesGeo.setAttribute('position', new THREE.BufferAttribute(wavePositions, 3));
    const waveParticlesMat = new THREE.PointsMaterial({ 
      color: 0xa0d8ef, 
      size: 0.12, 
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.5
    });
    const waveParticles = new THREE.Points(waveParticlesGeo, waveParticlesMat);
    waveParticles.name = "waveParticles";
    scene.add(waveParticles);

    // ---------- MALDIVES ATOLLS DATA ----------
    // Each atoll: name, position x,z, size, color, islands array [{x,z,size,type}]
    const atollsData = [
      { name: "Haa Alif", x: -4.5, z: 6.5, size: 2.8, color: 0x00b4d8, islands: [
        {x: -4.8, z: 6.9, s: 0.35, type: 'local'}, {x: -4.2, z: 6.1, s: 0.28, type: 'resort'}
      ]},
      { name: "Haa Dhaalu", x: -2.8, z: 5.4, size: 2.4, color: 0x0096c7, islands: [
        {x: -3.0, z: 5.6, s: 0.3, type: 'local'}, {x: -2.5, z: 5.1, s: 0.25, type: 'local'}
      ]},
      { name: "Shaviyani", x: -1.2, z: 6.8, size: 2.1, color: 0x00b4d8, islands: [
        {x: -1.0, z: 7.0, s: 0.32, type: 'resort'}
      ]},
      { name: "Noonu", x: 0.8, z: 6.2, size: 2.5, color: 0x0096c7, islands: [
        {x: 0.6, z: 6.4, s: 0.3, type: 'local'}, {x: 1.1, z: 5.9, s: 0.28, type: 'resort'}
      ]},
      { name: "Raa", x: 2.5, z: 5.5, size: 2.6, color: 0x00b4d8, islands: [
        {x: 2.3, z: 5.7, s: 0.33, type: 'local'}, {x: 2.8, z: 5.2, s: 0.3, type: 'resort'}
      ]},
      { name: "Baa", x: 4.2, z: 4.6, size: 2.9, color: 0x0096c7, islands: [
        {x: 4.0, z: 4.8, s: 0.35, type: 'resort'}, {x: 4.5, z: 4.3, s: 0.3, type: 'local'}
      ]},
      { name: "Lhaviyani", x: 1.5, z: 4.2, size: 2.2, color: 0x00b4d8, islands: [
        {x: 1.3, z: 4.3, s: 0.3, type: 'resort'}
      ]},
      { name: "Kaafu", x: 0.2, z: 3.0, size: 3.0, color: 0x00b4d8, islands: [
        {x: 0.0, z: 3.1, s: 0.5, type: 'male'}, 
        {x: 0.5, z: 2.7, s: 0.28, type: 'resort'},
        {x: -0.4, z: 3.3, s: 0.26, type: 'local'}
      ]},
      { name: "Alif Alif", x: -1.8, z: 2.8, size: 2.4, color: 0x0096c7, islands: [
        {x: -1.9, z: 2.9, s: 0.3, type: 'resort'}, {x: -1.5, z: 2.6, s: 0.27, type: 'local'}
      ]},
      { name: "Alif Dhaalu", x: -3.2, z: 1.9, size: 2.5, color: 0x00b4d8, islands: [
        {x: -3.3, z: 2.1, s: 0.32, type: 'resort'}
      ]},
      { name: "Vaavu", x: -1.0, z: 1.2, size: 2.0, color: 0x0096c7, islands: [
        {x: -0.9, z: 1.3, s: 0.28, type: 'local'}
      ]},
      { name: "Meemu", x: 0.5, z: 0.0, size: 2.3, color: 0x00b4d8, islands: [
        {x: 0.6, z: 0.1, s: 0.3, type: 'resort'}, {x: 0.3, z: -0.2, s: 0.26, type: 'local'}
      ]},
      { name: "Faafu", x: -2.0, z: -0.8, size: 2.1, color: 0x0096c7, islands: [
        {x: -2.1, z: -0.7, s: 0.28, type: 'local'}
      ]},
      { name: "Dhaalu", x: -3.5, z: -2.0, size: 2.4, color: 0x00b4d8, islands: [
        {x: -3.6, z: -1.8, s: 0.31, type: 'resort'}
      ]},
      { name: "Thaa", x: -1.5, z: -3.2, size: 2.2, color: 0x0096c7, islands: [
        {x: -1.4, z: -3.3, s: 0.29, type: 'local'}, {x: -1.7, z: -3.0, s: 0.27, type: 'resort'}
      ]},
      { name: "Laamu", x: 0.8, z: -3.8, size: 2.5, color: 0x00b4d8, islands: [
        {x: 0.9, z: -3.7, s: 0.32, type: 'resort'}
      ]},
      { name: "Gaafu Alif", x: 3.0, z: -4.5, size: 2.7, color: 0x0096c7, islands: [
        {x: 3.1, z: -4.4, s: 0.3, type: 'local'}, {x: 2.8, z: -4.7, s: 0.28, type: 'resort'}
      ]},
      { name: "Gaafu Dhaalu", x: 4.5, z: -5.8, size: 2.6, color: 0x00b4d8, islands: [
        {x: 4.6, z: -5.7, s: 0.31, type: 'local'}
      ]},
      { name: "Gnaviyani", x: 6.0, z: -7.0, size: 1.8, color: 0x0096c7, islands: [
        {x: 6.1, z: -6.9, s: 0.26, type: 'local'}
      ]},
      { name: "Addu", x: 7.2, z: -8.5, size: 2.5, color: 0x00b4d8, islands: [
        {x: 7.0, z: -8.4, s: 0.33, type: 'resort'}, {x: 7.4, z: -8.7, s: 0.3, type: 'local'}
      ]},
    ];

    const atollGroups = [];
    const islandObjects = [];
    const labelObjects = [];

    // Create atolls and islands
    atollsData.forEach((atoll) => {
      const atollGroup = new THREE.Group();
      atollGroup.position.set(atoll.x, 0.05, atoll.z);
      
      // Atoll ring (main reef)
      const ringGeo = new THREE.TorusGeometry(atoll.size * 0.9, 0.18, 16, 48);
      const ringMat = new THREE.MeshStandardMaterial({ 
        color: atoll.color, 
        roughness: 0.5, 
        metalness: 0.3,
        emissive: new THREE.Color(atoll.color).multiplyScalar(0.2)
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.castShadow = true;
      ring.receiveShadow = true;
      ring.name = `atoll-${atoll.name}`;
      atollGroup.add(ring);

      // Inner lagoon
      const lagoonGeo = new THREE.CircleGeometry(atoll.size * 0.7, 32);
      const lagoonMat = new THREE.MeshStandardMaterial({ 
        color: 0x48cae4, 
        roughness: 0.3, 
        metalness: 0.1,
        transparent: true,
        opacity: 0.5,
        emissive: new THREE.Color(0x023e8a)
      });
      const lagoon = new THREE.Mesh(lagoonGeo, lagoonMat);
      lagoon.rotation.x = -Math.PI / 2;
      lagoon.position.y = 0.02;
      lagoon.receiveShadow = true;
      atollGroup.add(lagoon);

      // Islands within atoll
      atoll.islands.forEach((islandData) => {
        const islandGroup = new THREE.Group();
        const localX = islandData.x - atoll.x;
        const localZ = islandData.z - atoll.z;
        islandGroup.position.set(localX, 0.15, localZ);
        
        let islandColor = 0x90e0ef; // local
        if (islandData.type === 'male') islandColor = 0xf4a261;
        else if (islandData.type === 'resort') islandColor = 0xe9c46a;
        
        // Island base
        const islandGeo = new THREE.CylinderGeometry(islandData.s * 0.7, islandData.s * 0.9, 0.25, 12);
        const islandMat = new THREE.MeshStandardMaterial({ 
          color: 0xe8d8b0, 
          roughness: 0.7,
          metalness: 0.1
        });
        const islandBase = new THREE.Mesh(islandGeo, islandMat);
        islandBase.castShadow = true;
        islandBase.receiveShadow = true;
        islandGroup.add(islandBase);
        
        // Island top (vegetation/buildings)
        const topGeo = new THREE.CylinderGeometry(islandData.s * 0.5, islandData.s * 0.65, 0.2, 10);
        const topMat = new THREE.MeshStandardMaterial({ 
          color: islandColor, 
          roughness: 0.5, 
          metalness: 0.2,
          emissive: new THREE.Color(islandColor).multiplyScalar(0.15)
        });
        const top = new THREE.Mesh(topGeo, topMat);
        top.position.y = 0.2;
        top.castShadow = true;
        top.receiveShadow = true;
        islandGroup.add(top);
        
        // Small palm trees for resorts
        if (islandData.type === 'resort' || islandData.type === 'male') {
          for (let t = 0; t < 2; t++) {
            const trunkGeo = new THREE.CylinderGeometry(0.04, 0.06, 0.4, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set((Math.random()-0.5)*0.3, 0.4, (Math.random()-0.5)*0.3);
            trunk.castShadow = true;
            islandGroup.add(trunk);
            
            const leavesGeo = new THREE.ConeGeometry(0.12, 0.25, 6);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.copy(trunk.position);
            leaves.position.y += 0.28;
            leaves.castShadow = true;
            islandGroup.add(leaves);
          }
        }
        
        // Store island data for interaction
        islandGroup.userData = {
          atollName: atoll.name,
          type: islandData.type,
          position: new THREE.Vector3(islandData.x, 0.4, islandData.z)
        };
        
        atollGroup.add(islandGroup);
        islandObjects.push(islandGroup);
      });

      scene.add(atollGroup);
      atollGroups.push({ group: atollGroup, name: atoll.name, position: new THREE.Vector3(atoll.x, 0.4, atoll.z) });
    });

    // ---------- ATOLL LABELS (CSS2D) ----------
    atollGroups.forEach((atollData) => {
      const labelDiv = document.createElement('div');
      labelDiv.textContent = atollData.name;
      labelDiv.style.color = '#c8e8ff';
      labelDiv.style.fontSize = '11px';
      labelDiv.style.fontWeight = 'bold';
      labelDiv.style.background = 'rgba(0,20,40,0.8)';
      labelDiv.style.padding = '3px 10px';
      labelDiv.style.borderRadius = '15px';
      labelDiv.style.border = '1px solid #00b4d8';
      labelDiv.style.pointerEvents = 'none';
      
      const label = new CSS2DObject(labelDiv);
      label.position.copy(atollData.position);
      label.position.y += 1.2;
      label.name = `label-${atollData.name}`;
      scene.add(label);
      labelObjects.push(label);
    });

    // ---------- RAYCASTER FOR ISLAND CLICK ----------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('island-tooltip');

    function onMouseClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(islandObjects, true);
      
      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.atollName) {
          obj = obj.parent;
        }
        if (obj && obj.userData.atollName) {
          const typeStr = obj.userData.type === 'male' ? '🏙️ Capital Malé' : 
                          obj.userData.type === 'resort' ? '🏖️ Resort Island' : '🏝️ Local Island';
          tooltip.textContent = `${typeStr} • ${obj.userData.atollName} Atoll`;
          tooltip.style.display = 'block';
          setTimeout(() => { tooltip.style.display = 'none'; }, 2500);
          
          // Highlight effect
          obj.children.forEach(child => {
            if (child.material && child.material.emissive) {
              child.material.emissive.set(0x444444);
              setTimeout(() => child.material.emissive.set(child.material.color.clone().multiplyScalar(0.15)), 400);
            }
          });
        }
      }
    }

    window.addEventListener('click', onMouseClick);

    // ---------- ACTION BUTTONS ----------
    let autoRotateEnabled = true;
    let wavesEnabled = true;
    let labelsVisible = true;

    document.getElementById('btn-rotate').addEventListener('click', function() {
      autoRotateEnabled = !autoRotateEnabled;
      controls.autoRotate = autoRotateEnabled;
      this.classList.toggle('active', autoRotateEnabled);
      this.textContent = autoRotateEnabled ? '🔄 Auto Rotate' : '🔄 Auto Rotate (Off)';
    });

    document.getElementById('btn-waves').addEventListener('click', function() {
      wavesEnabled = !wavesEnabled;
      waveParticles.visible = wavesEnabled;
      oceanSurface.material.opacity = wavesEnabled ? 0.85 : 0.5;
      this.classList.toggle('active', wavesEnabled);
      this.textContent = wavesEnabled ? '🌊 Ocean Waves' : '🌊 Ocean Waves (Off)';
    });

    document.getElementById('btn-labels').addEventListener('click', function() {
      labelsVisible = !labelsVisible;
      labelObjects.forEach(label => label.visible = labelsVisible);
      this.classList.toggle('active', labelsVisible);
      this.textContent = labelsVisible ? '🏷️ Atoll Names' : '🏷️ Atoll Names (Off)';
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      camera.position.set(18, 14, 22);
      controls.target.set(0, 0.8, 0);
      controls.update();
    });

    document.getElementById('btn-fly').addEventListener('click', () => {
      // Fly to Malé (Kaafu atoll, near 0,3)
      const targetPos = new THREE.Vector3(0.2, 3.5, 4.5);
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const endTarget = new THREE.Vector3(0, 0.5, 3);
      
      let progress = 0;
      const duration = 1500;
      const startTime = Date.now();
      
      function animateFly() {
        const elapsed = Date.now() - startTime;
        progress = Math.min(elapsed / duration, 1);
        // Ease in-out
        const t = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        camera.position.lerpVectors(startPos, targetPos, t);
        controls.target.lerpVectors(startTarget, endTarget, t);
        controls.update();
        
        if (progress < 1) {
          requestAnimationFrame(animateFly);
        }
      }
      animateFly();
      
      // Show tooltip
      tooltip.textContent = '🏙️ Capital: Malé • Kaafu Atoll';
      tooltip.style.display = 'block';
      setTimeout(() => { tooltip.style.display = 'none'; }, 3000);
    });

    // ---------- ANIMATION LOOP ----------
    const clock = new THREE.Clock();

    function animate() {
      const delta = clock.getDelta();
      const time = performance.now() * 0.001;
      
      // Animate ocean waves
      if (wavesEnabled) {
        oceanSurface.position.y = -0.4 + Math.sin(time * 2.5) * 0.08;
        waveParticles.rotation.y += 0.0003;
        const positions = waveParticles.geometry.attributes.position.array;
        for (let i = 1; i < positions.length; i += 3) {
          positions[i] = -0.35 + Math.sin(time * 4 + i) * 0.12;
        }
        waveParticles.geometry.attributes.position.needsUpdate = true;
      }
      
      controls.update();
      
      // Render
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animate);

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('🌴 3D Maldives Map Ready!');
    console.log('🖱️ Click islands • Use buttons for actions');
    console.log('🗺️ Atolls:', atollsData.length, '• Islands:', islandObjects.length);
  </script>
</body>
